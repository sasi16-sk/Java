8:{n:"Inheritance",p:[
P("Program 5: Dynamic Method Dispatch",String.raw`class Shape { void draw() { System.out.println("Drawing a shape"); } }
class Circle extends Shape { void draw() { System.out.println("Drawing a circle"); } }
class Rectangle extends Shape { void draw() { System.out.println("Drawing a rectangle"); } }
class Triangle extends Shape { void draw() { System.out.println("Drawing a triangle"); } }
public class Dispatch {
    public static void main(String[] args) {
        Shape s;
        s = new Circle();    s.draw();
        s = new Rectangle(); s.draw();
        s = new Triangle();  s.draw();
    }
}`,`Drawing a circle
Drawing a rectangle
Drawing a triangle`)]},

P("Program 6: Defining and Implementing an Interface",String.raw`interface Shape { double area(); }
class Circle implements Shape {
    double r = 7;
    public double area() { return Math.PI * r * r; }

    public double area() { return l * w; }

public class InterfaceDemo {

        Shape r = new Rectangle();
        System.out.println("Circle area    : " + c.area());

const $=s=>document.querySelector(s),app=$("#app"),nav=$("#nav");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const hl=s=>esc(s).replace(/\b(public|class|static|void|int|double|float|long|short|byte|char|boolean|new|return|if|else|for|extends|implements|interface|this|String|System)\b/g,'<span class=k>$1</span>').replace(/("[^"]*")/g,'<span class=s>$1</span>');
nav.innerHTML=Object.keys(W).map(k=>`<button data-w="${k}" onclick="location.hash='#/w/${k}/0'">Week ${k}</button>`).join("");
function home(){
 const pic=`<img src="${ME.img}" alt="profile" onerror="this.outerHTML='<div class=ph>${ME.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>'">`;
 app.innerHTML=`<section class="hero"><div><div class="tag">${ME.subj} • Lab Journal</div><h1>Write it. Run it. <span>Nail it.</span></h1><p style="color:var(--mu);max-width:480px">A digital notebook of every Java experiment I ran this semester, with source code and console output, week by week.</p></div>
 <div class="pc">${pic}<h3>${ME.name}</h3><dl><dt>Roll No</dt><dd>${ME.roll}</dd><dt>Year</dt><dd>${ME.year}</dd><dt>Branch</dt><dd>${ME.branch}</dd><dt>Section</dt><dd>${ME.sec}</dd><dt>Subject</dt><dd>${ME.subj}</dd></dl></div></section>
 <h2>Pick a week</h2><div class="grid">${Object.entries(W).map(([k,v])=>`<div class="wk" onclick="location.hash='#/w/${k}/0'"><b>W${k}</b>${v.n}<br><small>${v.p?v.p.length+" programs":v.table?"Table":"Nil"}</small></div>`).join("")}</div>`;
}
function week(k,i){
 const w=W[k];let h=`<div class="tag">Week ${k}</div><h2 style="margin:4px 0">${w.n}</h2>`;
 if(w.table){const t=w.table;h+=`<div class="box tw"><table><tr>${t.h.map(x=>`<th>${x}</th>`).join("")}</tr>${t.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`}
 else if(w.note)h+=`<div class="box" style="padding:30px;text-align:center;color:var(--mu)">${w.note}</div>`;
 else{const p=w.p[i];
  h+=`<div class="tabs">${w.p.map((x,j)=>`<button class="${j==i?"on":""}" onclick="location.hash='#/w/${k}/${j}'">${x.t.split(":")[0]}</button>`).join("")}</div><h3>${p.t}</h3>
  <div class="box"><div class="bh"><span>SOURCE CODE</span><button onclick="cp(this)">copy</button></div><pre>${hl(p.c)}</pre></div>
  <div class="box out"><div class="bh"><span>OUTPUT</span></div><pre>${esc(p.o)}</pre></div>
  <div class="nb"><button ${i?"":"disabled"} onclick="location.hash='#/w/${k}/${i-1}'">&larr; Prev</button><button ${i<w.p.length-1?"":"disabled"} onclick="location.hash='#/w/${k}/${i+1}'">Next &rarr;</button></div>`}
 app.innerHTML=h;
}
function cp(b){navigator.clipboard&&navigator.clipboard.writeText(b.closest(".box").querySelector("pre").textContent);b.textContent="copied";setTimeout(()=>b.textContent="copy",1200)}
function route(){
 const m=location.hash.match(/#\/w\/(\d+)\/(\d+)/);
 nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",m&&b.dataset.w==m[1]));
 m&&W[m[1]]?week(m[1],+m[2]):home();window.scrollTo(0,0);
}
addEventListener("hashchange",route);route();
</script></body></html>
